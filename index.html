<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전 브레인 스토밍</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; font-size: 12px; }
        .table-custom th, .table-custom td { border: 1px solid #cbd5e1; padding: 4px 8px; text-align: center; }
        .table-custom th { background-color: #f1f5f9; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-200 p-2 text-slate-800">

    <!-- 로그인 모달 -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded shadow-lg p-6 w-full max-w-sm border border-slate-300">
            <div class="text-center mb-4">
                <i class="fa-solid fa-shield-halved text-3xl text-blue-800 mb-2"></i>
                <h2 class="text-base font-bold text-slate-800">안전 점검 시스템 로그인</h2>
            </div>
            <form id="loginForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold mb-1">이메일</label>
                    <input type="email" id="loginEmail" required class="w-full text-xs p-2 border border-slate-300 rounded focus:outline-none focus:border-blue-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">비밀번호</label>
                    <input type="password" id="loginPassword" required class="w-full text-xs p-2 border border-slate-300 rounded focus:outline-none focus:border-blue-600">
                </div>
                <div id="loginError" class="text-xs text-red-500 font-semibold hidden text-center"></div>
                <button type="submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-2 rounded text-xs">로그인</button>
            </form>
        </div>
    </div>

    <!-- 상단 탭 및 시스템 헤더 -->
    <div class="max-w-[1600px] mx-auto bg-white border border-slate-300 shadow-sm p-3 mb-2">
        <div class="flex justify-between items-center mb-2">
            <div class="flex gap-1">
                <button class="bg-slate-500 text-white px-3 py-1 text-xs rounded-t font-bold">노사합동점검</button>
                <button class="bg-blue-900 text-white px-3 py-1 text-xs rounded-t font-bold">안전 브레인 스토밍</button>
                <button class="bg-slate-500 text-white px-3 py-1 text-xs rounded-t font-bold">안전지킴이</button>
                <button class="bg-slate-500 text-white px-3 py-1 text-xs rounded-t font-bold">합의체점검</button>
            </div>
            <div class="flex items-center gap-3">
                <span id="authStatus" class="text-xs text-slate-600">접속 계정: -</span>
                <button id="btnLogout" class="hidden bg-slate-600 hover:bg-slate-700 text-white px-2 py-0.5 text-xs rounded">로그아웃</button>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-3">
            <!-- 좌측: 점검 등록 폼 -->
            <div class="col-span-6 border border-slate-300 p-2 bg-white">
                <div class="flex justify-between items-center bg-blue-900 text-white p-1.5 px-3 font-bold mb-2">
                    <span><i class="fa-solid fa-pen-to-square"></i> 점검 등록 (안전 브레인 스토밍)</span>
                    <button id="btnSave" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-0.5 rounded text-xs font-normal">
                        <i class="fa-solid fa-floppy-disk"></i> 저장하기
                    </button>
                </div>

                <div class="flex justify-between items-center border-b pb-1 mb-2 font-bold text-slate-700">
                    <span>&gt; 안전 브레인 스토밍(26.09.07)</span>
                    <span class="text-blue-900 font-extrabold italic">/// HWASHIN</span>
                </div>

                <!-- 사진 영역 -->
                <div class="grid grid-cols-2 border border-slate-300 mb-2 min-h-[220px]">
                    <!-- 개선 전 -->
                    <div class="border-r border-slate-300 p-1 flex flex-col justify-between relative bg-slate-50" id="beforeDropZone">
                        <div class="bg-slate-200 text-center font-bold py-0.5 border-b border-slate-300">개선 전</div>
                        <div class="flex-1 flex items-center justify-center relative cursor-pointer min-h-[180px]">
                            <img id="beforePreview" class="hidden absolute inset-0 w-full h-full object-contain p-1" />
                            <div id="beforePlaceholder" class="text-center text-slate-400">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl mb-1"></i>
                                <p class="text-[11px]">클릭/드래그 또는 Ctrl+V</p>
                            </div>
                        </div>
                        <input type="file" id="beforeFileInput" accept="image/*" class="hidden">
                    </div>
                    <!-- 개선 후 -->
                    <div class="p-1 flex flex-col justify-between relative bg-slate-50" id="afterDropZone">
                        <div class="bg-slate-200 text-center font-bold py-0.5 border-b border-slate-300">개선 후</div>
                        <div class="flex-1 flex items-center justify-center relative cursor-pointer min-h-[180px]">
                            <img id="afterPreview" class="hidden absolute inset-0 w-full h-full object-contain p-1" />
                            <div id="afterPlaceholder" class="text-center text-slate-400">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl mb-1"></i>
                                <p class="text-[11px]">클릭/드래그 또는 Ctrl+V</p>
                            </div>
                        </div>
                        <input type="file" id="afterFileInput" accept="image/*" class="hidden">
                    </div>
                </div>

                <!-- 입력 표 -->
                <table class="w-full table-custom text-xs">
                    <tbody>
                        <tr>
                            <th class="w-16">발견</th>
                            <td colspan="3"><input type="text" id="inputDiscovery" placeholder="불안전한 상태/행동 입력" class="w-full border border-slate-300 p-1 rounded-none focus:outline-none"></td>
                        </tr>
                        <tr>
                            <th>개선안</th>
                            <td colspan="3"><input type="text" id="inputImprovement" placeholder="개선 내용 입력" class="w-full border border-slate-300 p-1 rounded-none focus:outline-none"></td>
                        </tr>
                        <tr>
                            <th class="w-16">점검 구역</th>
                            <td><input type="text" id="inputArea" placeholder="예: 도장 라인" class="w-full border border-slate-300 p-1 rounded-none focus:outline-none"></td>
                            <th class="w-16">대상 부서</th>
                            <td>
                                <select id="selectDept" class="w-full border border-slate-300 p-1 rounded-none focus:outline-none">
                                    <option value="생산팀">생산팀</option>
                                    <option value="안전환경팀">안전환경팀</option>
                                    <option value="보전통합팀">보전통합팀</option>
                                    <option value="품질팀">품질팀</option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 우측: 팀별 통계 및 조회 목록 -->
            <div class="col-span-6 space-y-3">
                <!-- 현황표 -->
                <div class="border border-slate-300 p-2 bg-white">
                    <div class="font-bold text-slate-800 mb-1 flex items-center gap-1">
                        <i class="fa-solid fa-table-cells"></i> 팀별 점검 통계 현황
                    </div>
                    <table class="w-full table-custom text-xs">
                        <thead>
                            <tr>
                                <th>구분</th>
                                <th>생산팀</th>
                                <th>안전환경팀</th>
                                <th>보전통합팀</th>
                                <th>품질팀</th>
                                <th>합계</th>
                            </tr>
                        </thead>
                        <tbody id="statTableBody">
                            <tr><th>지적사항</th><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
                            <tr><th>개선</th><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
                            <tr><th>미개선</th><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
                            <tr><th>개선율</th><td>0%</td><td>0%</td><td>0%</td><td>0%</td><td>0%</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- 조회 점검목록 -->
                <div class="border border-slate-300 p-2 bg-white">
                    <div class="font-bold text-slate-800 mb-2 flex justify-between items-center">
                        <span><i class="fa-solid fa-list"></i> 조회 점검목록</span>
                    </div>
                    <div class="overflow-x-auto max-h-[350px]">
                        <table class="w-full table-custom text-xs">
                            <thead>
                                <tr>
                                    <th class="w-8">순번</th>
                                    <th>구분</th>
                                    <th>상태</th>
                                    <th>대상부서</th>
                                    <th>점검구역</th>
                                    <th>안전점검 내용</th>
                                    <th class="w-16">등록일자</th>
                                    <th class="w-10">삭제</th>
                                </tr>
                            </thead>
                            <tbody id="dataListTable">
                                <tr><td colspan="8" class="text-slate-400 py-4">데이터를 불러오는 중입니다...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, serverTimestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 사용자 실제 Firebase 정보 적용
       const firebaseConfig = {
           apiKey: "AIzaSyCVOMvYND3W-znSwwYr63aGLRQEOYG203c",
           authDomain: "hwashin-safety.firebaseapp.com",
           projectId: "hwashin-safety",
           storageBucket: "hwashin-safety.firebasestorage.app",
           messagingSenderId: "925751971876",
           appId: "1:925751971876:web:57cb605106c4973e4688b1",
           measurementId: "G-VBZF0P12B5"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let beforeImgData = "";
        let afterImgData = "";

        // 로그인 핸들러
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                document.getElementById('loginError').classList.add('hidden');
            } catch (err) {
                document.getElementById('loginError').innerText = "로그인 실패: 정보를 확인하세요.";
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('authStatus').innerText = `접속 계정: ${user.email}`;
                document.getElementById('btnLogout').classList.remove('hidden');
                loadDataList();
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
                document.getElementById('authStatus').innerText = "로그인 필요";
                document.getElementById('btnLogout').classList.add('hidden');
            }
        });

        // 이미지 압축 (800px 축소, 1MB 제한 극복)
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function handleImageUpload(file, target) {
            if (!file || !file.type.startsWith("image/")) return;
            const compressed = await compressImage(file);
            if (target === 'before') {
                beforeImgData = compressed;
                document.getElementById('beforePreview').src = compressed;
                document.getElementById('beforePreview').classList.remove('hidden');
                document.getElementById('beforePlaceholder').classList.add('hidden');
            } else {
                afterImgData = compressed;
                document.getElementById('afterPreview').src = compressed;
                document.getElementById('afterPreview').classList.remove('hidden');
                document.getElementById('afterPlaceholder').classList.add('hidden');
            }
        }

        const setupSlot = (zoneId, inputId, target) => {
            document.getElementById(zoneId).addEventListener('click', () => document.getElementById(inputId).click());
            document.getElementById(inputId).addEventListener('change', (e) => {
                if (e.target.files[0]) handleImageUpload(e.target.files[0], target);
            });
            document.addEventListener('paste', (e) => {
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) {
                        handleImageUpload(items[i].getAsFile(), target);
                        break;
                    }
                }
            });
        };

        setupSlot('beforeDropZone', 'beforeFileInput', 'before');
        setupSlot('afterDropZone', 'afterFileInput', 'after');

        // 저장 기능
        document.getElementById('btnSave').addEventListener('click', async () => {
            const discovery = document.getElementById('inputDiscovery').value.trim();
            const improvement = document.getElementById('inputImprovement').value.trim();
            const area = document.getElementById('inputArea').value.trim();
            const dept = document.getElementById('selectDept').value;

            if (!discovery) { alert("발견 내용을 입력해 주세요."); return; }

            try {
                await addDoc(collection(db, "checklists"), {
                    beforeImg: beforeImgData,
                    afterImg: afterImgData,
                    discovery: discovery,
                    improvement: improvement,
                    area: area,
                    dept: dept,
                    createdAt: serverTimestamp()
                });
                alert("저장되었습니다.");
                location.reload();
            } catch (err) {
                alert("저장 실패");
            }
        });

        // 비밀번호 확인 후 삭제 기능
        window.deleteChecklist = async function(docId) {
            const user = auth.currentUser;
            if (!user) return;
            const pw = prompt("삭제 권한 확인을 위해 현재 계정의 비밀번호를 입력해 주세요.");
            if (!pw) return;

            try {
                const cred = EmailAuthProvider.credential(user.email, pw);
                await reauthenticateWithCredential(user, cred);
                await deleteDoc(doc(db, "checklists", docId));
                alert("삭제되었습니다.");
            } catch (err) {
                alert("삭제 실패: 비밀번호가 일치하지 않습니다.");
            }
        };

        // 데이터 실시간 로드 및 통계 계산
        function loadDataList() {
            const q = query(collection(db, "checklists"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('dataListTable');
                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-slate-400 py-4">등록된 점검 내역이 없습니다.</td></tr>`;
                    return;
                }

                let html = "";
                let index = 1;
                snapshot.forEach((docItem) => {
                    const d = docItem.data();
                    const dateStr = d.createdAt ? new Date(d.createdAt.seconds * 1000).toISOString().slice(2, 10).replace(/-/g, '.') : '-';
                    html += `
                        <tr>
                            <td>${index++}</td>
                            <td><span class="bg-red-500 text-white px-1 rounded text-[10px]">개선요청</span></td>
                            <td>불안전 상태</td>
                            <td>${d.dept}</td>
                            <td>${d.area || '-'}</td>
                            <td class="text-left">${d.discovery || '-'}</td>
                            <td>${dateStr}</td>
                            <td>
                                <button onclick="deleteChecklist('${docItem.id}')" class="text-red-600 hover:text-red-800">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
            });
        }
    </script>
</body>
</html>
