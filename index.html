<!-- UI 및 메인 로직 스크립트 (페이징, 선택 고유 ID Set 및 공통 헬퍼 함수 반영 완료) -->
    <script>
        const TARGET_TEAMS = ['생산팀', '안전환경노무팀', '생관물류팀', '품질팀', 'HR다인'];
        let currentCategory = '안전 브레인 스토밍';
        let selectedCell = 'beforeCell';
        let editingId = null;
        let images = { beforeCell: '', afterCell: '' };
        let currentFilterDate = new Date();
        let isDateAscending = true;

        // 페이징 및 선택 상태 관리 변수
        let currentPage = 1;
        const rowsPerPage = 10;
        let selectedIds = new Set(); // 페이지가 넘어가도 선택된 항목의 고유 ID를 안전하게 유지

        window.onload = function() {
            const now = new Date();
            document.getElementById('current-date').innerText = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0');
            document.getElementById('input-guide-date').value = now.toISOString().substring(0, 10);
            initFilterPicker();
            updateCategoryUI();
        };

        function switchCategory(categoryName) {
            currentCategory = categoryName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.replace(/\s+/g, '') === categoryName.replace(/\s+/g, '')));
            selectedIds.clear(); // 탭 이동 시 선택 초기화
            currentPage = 1;
            resetForm();
            updateCategoryUI();
        }

        function initFilterPicker() {
            const type = document.getElementById('filter-type').value;
            const container = document.getElementById('picker-container');
            const yyyy = currentFilterDate.getFullYear(), mm = String(currentFilterDate.getMonth()+1).padStart(2,'0'), dd = String(currentFilterDate.getDate()).padStart(2,'0');
            if(type === 'daily' || type === 'weekly') container.innerHTML = `<input type="date" id="picker-input" value="${yyyy}-${mm}-${dd}" onchange="onPickerChange(this.value)">`;
            else if(type === 'monthly') container.innerHTML = `<input type="month" id="picker-input" value="${yyyy}-${mm}" onchange="onPickerChange(this.value)">`;
            else if(type === 'yearly') container.innerHTML = `<input type="number" id="picker-input" value="${yyyy}" min="2000" max="2099" style="width:70px;" onchange="onPickerChange(this.value)">`;
            else container.innerHTML = `<span style="font-size:12px; color:#666;">전체 범위</span>`;
        }

        function onFilterTypeChange() { currentPage = 1; initFilterPicker(); refreshDataView(); }
        function onPickerChange(val) {
            currentPage = 1;
            const type = document.getElementById('filter-type').value;
            if(type === 'daily' || type === 'weekly') currentFilterDate = new Date(val);
            else if(type === 'monthly') { const [y, m] = val.split('-'); currentFilterDate = new Date(y, parseInt(m)-1, 1); }
            else if(type === 'yearly') currentFilterDate = new Date(parseInt(val), 0, 1);
            refreshDataView();
        }

        function navigateDate(delta) {
            currentPage = 1;
            const type = document.getElementById('filter-type').value;
            if(type === 'daily') currentFilterDate.setDate(currentFilterDate.getDate()+delta);
            else if(type === 'weekly') currentFilterDate.setDate(currentFilterDate.getDate()+(delta*7));
            else if(type === 'monthly') currentFilterDate.setMonth(currentFilterDate.getMonth()+delta);
            else if(type === 'yearly') currentFilterDate.setFullYear(currentFilterDate.getFullYear()+delta);
            initFilterPicker(); refreshDataView();
        }

        function onGuideDateChange() { 
            updateHeaderDate(); 
            // 신규 등록 상태일 때만 지도일자에 맞춰 자동 시퀀스 번호(예: 예산 공장-N) 갱신
            if (!editingId) {
                const guideDateVal = document.getElementById('input-guide-date').value || new Date().toISOString().substring(0, 10);
                const db = window.dbData || [];
                const count = db.filter(d => d.category === currentCategory && d.guideDate === guideDateVal).length;
                document.getElementById('factory-seq-code').innerText = `예산 공장-${count + 1}`;
            }
        }

        function updateHeaderDate() {
            const gVal = document.getElementById('input-guide-date').value;
            let fDate = '';
            if(gVal) { const d = new Date(gVal); fDate = `(${String(d.getFullYear()).substring(2)}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')})`; }
            document.getElementById('ppt-title-text').innerText = `${currentCategory}${fDate}`;
        }

        function updateCategoryUI() {
            document.getElementById('category-name-display').innerText = currentCategory;
            updateHeaderDate();
            if(!editingId) {
                const guideDateVal = document.getElementById('input-guide-date').value || new Date().toISOString().substring(0, 10);
                const db = window.dbData || [];
                const count = db.filter(d => d.category === currentCategory && d.guideDate === guideDateVal).length;
                document.getElementById('factory-seq-code').innerText = `예산 공장-${count + 1}`;
            }
            refreshDataView();
            updateStorageQuotaDisplay();
        }

        function updateStorageQuotaDisplay() {
            const db = window.dbData || [];
            let totalBytes = 0;

            db.forEach(item => {
                totalBytes += JSON.stringify(item).length;
                if (item.beforeImg && typeof item.beforeImg === 'string') totalBytes += item.beforeImg.length;
                if (item.afterImg && typeof item.afterImg === 'string') totalBytes += item.afterImg.length;
            });

            const totalMB = totalBytes / (1024 * 1024);
            const limitMB = 1024; // 1GB
            const percent = Math.min(100, (totalMB / limitMB) * 100).toFixed(2);

            const defaultSlideMB = 0.9;
            const avgSlideMB = (db.length > 0 && totalMB > 0) ? (totalMB / db.length) : defaultSlideMB;
            const realisticSlideMB = Math.max(avgSlideMB, 0.3);

            const remainingMB = Math.max(0, limitMB - totalMB);
            const estimatedRemainingSlides = Math.floor(remainingMB / realisticSlideMB);

            document.getElementById('storage-used-text').innerText = totalMB >= 1024 ? `${(totalMB / 1024).toFixed(2)} GB` : `${totalMB.toFixed(2)} MB`;
            document.getElementById('storage-percent').innerText = `${percent}%`;
            document.getElementById('storage-remaining-slides').innerText = `약 ${estimatedRemainingSlides.toLocaleString()}장 추가 저장 가능`;
        }

        function getPeriodFilteredData() {
            const type = document.getElementById('filter-type').value;
            const db = window.dbData || [];
            let list = db.filter(d => d.category === currentCategory);
            if(type !== 'all') {
                list = list.filter(item => {
                    if(!item.guideDate) return false;
                    const parts = item.guideDate.split('-');
                    if(parts.length !== 3) return false;
                    const t = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
                    
                    if(type === 'daily') {
                        return t.getFullYear() === currentFilterDate.getFullYear() &&
                               t.getMonth() === currentFilterDate.getMonth() &&
                               t.getDate() === currentFilterDate.getDate();
                    }
                    if(type === 'weekly') { 
                        const s = new Date(currentFilterDate); s.setDate(s.getDate()-3); s.setHours(0,0,0,0);
                        const e = new Date(currentFilterDate); e.setDate(e.getDate()+3); e.setHours(23,59,59,999);
                        return t >= s && t <= e; 
                    }
                    if(type === 'monthly') return t.getFullYear() === currentFilterDate.getFullYear() && t.getMonth() === currentFilterDate.getMonth();
                    if(type === 'yearly') return t.getFullYear() === currentFilterDate.getFullYear();
                    return true;
                });
            }
            return list;
        }

        function toggleDateSort() {
            isDateAscending = !isDateAscending;
            document.getElementById('sort-icon').innerText = isDateAscending ? '▲' : '▼';
            refreshDataView();
        }

        function hasAfterImage(row) {
            return !!(row && row.afterImg && String(row.afterImg).trim() !== '');
        }

        // [요청 반영 2]: 필터 및 정렬이 적용된 목록을 공통으로 가져오는 헬퍼 함수 추가
        function getFilteredAndSortedData() {
            const pList = getPeriodFilteredData();
            let fList = pList;
            const sF = document.getElementById('col-filter-status').value;
            const tF = document.getElementById('col-filter-type').value;
            const tgF = document.getElementById('col-filter-target').value;
            
            if(sF !== 'all') fList = fList.filter(i => sF === 'after' ? hasAfterImage(i) : !hasAfterImage(i));
            if(tF !== 'all') fList = fList.filter(i => i.type === tF);
            if(tgF !== 'all') fList = fList.filter(i => i.target === tgF);

            fList.sort((a,b) => {
                const dateA = a.guideDate ? new Date(a.guideDate) : new Date(0);
                const dateB = b.guideDate ? new Date(b.guideDate) : new Date(0);
                return isDateAscending ? dateA - dateB : dateB - dateA;
            });

            return fList;
        }

        // [요청 반영 3]: refreshDataView 함수 내부 변경 (공통 헬퍼 함수 활용)
        function refreshDataView() {
            const pList = getPeriodFilteredData();
            renderMatrixStats(pList);
            const fList = getFilteredAndSortedData();
            renderListWithPagination(fList);
        }

        function renderMatrixStats(pData) {
            const type = document.getElementById('filter-type').value;
            const y = String(currentFilterDate.getFullYear()).substring(2), m = String(currentFilterDate.getMonth()+1).padStart(2,'0'), d = String(currentFilterDate.getDate()).padStart(2,'0');
            document.getElementById('matrix-period-label').innerText = (type === 'daily') ? `${y}.${m}.${d}` : (type === 'monthly') ? `${y}년 ${m}월` : (type === 'yearly') ? `${y}년` : (type === 'all') ? '전체' : `${y}.${m} 주간`;
            
            let html = '', sumI = 0, sumD = 0, sumU = 0;
            const counts = TARGET_TEAMS.map(team => {
                const items = pData.filter(d => d.target === team);
                const iC = items.length;
                const dC = items.filter(d => hasAfterImage(d)).length;
                const uC = iC - dC;
                sumI += iC; sumD += dC; sumU += uC;
                return { team, iC, dC, uC, rate: iC > 0 ? Math.round((dC/iC)*100)+'%' : '-' };
            });

            const rows = ['지적사항', '개선', '미개선', '개선율'];
            rows.forEach(label => {
                html += `<tr><td>${label}</td>`;
                counts.forEach(c => {
                    let val = (label === '지적사항') ? c.iC : (label === '개선') ? c.dC : (label === '미개선') ? (c.iC === 0 ? '-' : c.uC) : c.rate;
                    html += `<td>${val}</td>`;
                });
                let totalVal = (label === '지적사항') ? sumI : (label === '개선') ? sumD : (label === '미개선') ? (sumI === 0 ? '-' : sumU) : (sumI > 0 ? Math.round((sumD/sumI)*100)+'%' : '-');
                html += `<td style="font-weight:bold;">${totalVal}</td></tr>`;
            });
            document.getElementById('matrix-body').innerHTML = html;
        }

        // 페이징 처리 및 체크박스 상태 유지 반영 렌더러
        function renderListWithPagination(fullList) {
            const tbody = document.getElementById('data-list-body');
            tbody.innerHTML = '';

            const totalPages = Math.ceil(fullList.length / rowsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const currentData = fullList.slice(startIndex, endIndex);

            currentData.forEach((row, idx) => {
                const tr = document.createElement('tr');
                if (editingId === row.id) tr.className = 'selected-row';
                const isAfter = hasAfterImage(row);
                
                // Set에 저장된 고유 ID를 바탕으로 체크 상태 유지
                const isChecked = selectedIds.has(row.id) ? 'checked' : '';

                tr.onclick = () => loadRecordForEdit(row.id);
                tr.innerHTML = `
                    <td onclick="event.stopPropagation()"><input type="checkbox" class="row-checkbox" value="${row.id}" ${isChecked} onchange="toggleRowSelection(this)" style="cursor:pointer;"></td>
                    <td>${startIndex + idx + 1}</td>
                    <td><span class="badge-status ${isAfter ? 'bg-after' : 'bg-before'}">${isAfter ? '개선후' : '개선전'}</span></td>
                    <td>${row.type}</td>
                    <td>${row.target}</td>
                    <td>${row.zone || '-'}</td>
                    <td style="text-align:left;">${row.item}</td>
                    <td>${row.guideDate ? row.guideDate.substring(2).replace(/-/g,'.') : ''}</td>
                    <td><button class="btn btn-danger" style="padding:2px 6px; font-size:10px;" onclick="deleteRecord(event, '${row.id}')"><i class="fa-solid fa-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });

            renderPaginationControls(totalPages, fullList);
            updateMasterCheckboxState(currentData);
        }

        function renderPaginationControls(totalPages, fullList) {
            const container = document.getElementById('pagination-container');
            container.innerHTML = '';

            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderListWithPagination(fullList);
                }
            };
            container.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.innerText = i;
                pageBtn.onclick = () => {
                    currentPage = i;
                    renderListWithPagination(fullList);
                };
                container.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderListWithPagination(fullList);
                }
            };
            container.appendChild(nextBtn);
        }

        function toggleRowSelection(checkbox) {
            const id = checkbox.value;
            if (checkbox.checked) {
                selectedIds.add(id);
            } else {
                selectedIds.delete(id);
            }
            updateMasterCheckboxStateFromDOM();
        }

        function toggleSelectAll(master) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = master.checked;
                if (master.checked) {
                    selectedIds.add(cb.value);
                } else {
                    selectedIds.delete(cb.value);
                }
            });
        }

        function updateMasterCheckboxState(currentData) {
            const checkAll = document.getElementById('check-all');
            if (!checkAll || currentData.length === 0) {
                if (checkAll) checkAll.checked = false;
                return;
            }
            const allChecked = currentData.every(item => selectedIds.has(item.id));
            checkAll.checked = allChecked;
        }

        function updateMasterCheckboxStateFromDOM() {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const checkAll = document.getElementById('check-all');
            if (checkAll && checkboxes.length > 0) {
                checkAll.checked = checkboxes.length === checkedBoxes.length;
            }
        }

        function deleteSelectedRecords() {
            const selectedIdsArray = Array.from(selectedIds);
            if (selectedIdsArray.length === 0) {
                alert('삭제할 항목을 선택해 주세요.');
                return;
            }

            if (window.deleteMultipleRecordsFromFirestore) {
                window.deleteMultipleRecordsFromFirestore(selectedIdsArray).then(() => {
                    selectedIds.clear();
                });
            }
        }

        function selectCell(id) { 
            selectedCell = id; 
            document.getElementById('beforeCell').classList.remove('focused'); 
            document.getElementById('afterCell').classList.remove('focused'); 
            document.getElementById(id).classList.add('focused'); 
        }

        document.getElementById('beforeCell').addEventListener('click', (e) => { 
            if(!e.target.closest('.image-controls') && !images.beforeCell) document.getElementById('beforeInput').click(); 
        });
        document.getElementById('afterCell').addEventListener('click', (e) => { 
            if(!e.target.closest('.image-controls') && !images.afterCell) document.getElementById('afterInput').click(); 
        });

        function handleFileSelect(e, id) { const f = e.target.files[0]; if(f) renderImg(f, id); }

        document.addEventListener('paste', (e) => {
            const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            if(activeTag === 'textarea' || activeTag === 'input') return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for(let item of items) {
                if(item.type.indexOf('image') !== -1) {
                    renderImg(item.getAsFile(), selectedCell);
                    break;
                }
            }
        });

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function renderImg(file, id) {
            const compressedBase64 = await compressImage(file);
            images[id] = compressedBase64;
            const isBefore = (id === 'beforeCell');
            document.getElementById(isBefore ? 'beforeImg' : 'afterImg').src = compressedBase64;
            document.getElementById(isBefore ? 'beforeImg' : 'afterImg').style.display = 'block';
            document.getElementById(isBefore ? 'beforeText' : 'afterText').style.display = 'none';
        }

        function clearImg(id, event) {
            if(event) event.stopPropagation();
            images[id] = '';
            const isBefore = (id === 'beforeCell');
            document.getElementById(isBefore ? 'beforeImg' : 'afterImg').src = '';
            document.getElementById(isBefore ? 'beforeImg' : 'afterImg').style.display = 'none';
            document.getElementById(isBefore ? 'beforeText' : 'afterText').style.display = 'block';
            document.getElementById(isBefore ? 'beforeInput' : 'afterInput').value = '';
        }

        function saveRecord() {
            const itemVal = document.getElementById('input-item').value.trim();
            if(!itemVal) { alert('안건 내용을 입력해주세요.'); return; }

            const db = window.dbData || [];
            const recordData = {
                category: currentCategory,
                seqCode: document.getElementById('factory-seq-code').innerText,
                item: itemVal,
                solution: document.getElementById('input-solution').value.trim(),
                zone: document.getElementById('input-zone').value.trim(),
                target: document.getElementById('input-target').value,
                dept: document.getElementById('input-dept').value.trim(),
                type: document.getElementById('input-type').value,
                guideDate: document.getElementById('input-guide-date').value,
                planDate: document.getElementById('input-plan-date').value,
                completeDate: document.getElementById('input-complete-date').value,
                beforeImg: images.beforeCell,
                afterImg: images.afterCell,
                regDate: editingId ? (db.find(d => d.id === editingId)?.regDate || new Date().toISOString().substring(0, 10)) : new Date().toISOString().substring(0, 10)
            };

            if (window.saveRecordToFirestore) {
                window.saveRecordToFirestore(recordData);
            }
        }

        // [요청 반영 1]: loadRecordForEdit 함수 수정 (현재 필터/정렬 조건이 적용된 목록 기준인 getFilteredAndSortedData를 사용해 올바른 레코드 탐색)
        function loadRecordForEdit(id) {
            const fList = getFilteredAndSortedData();
            const row = fList.find(d => d.id === id);
            if(!row) return;

            editingId = row.id;
            window.editingId = row.id;
            document.getElementById('form-mode-title').innerText = '점검 수정';
            document.getElementById('btn-cancel-edit').style.display = 'inline-flex';
            document.getElementById('factory-seq-code').innerText = row.seqCode || '예산 공장-1';
            
            document.getElementById('input-item').value = row.item || '';
            document.getElementById('input-solution').value = row.solution || '';
            document.getElementById('input-zone').value = row.zone || '';
            document.getElementById('input-target').value = row.target || '생산팀';
            document.getElementById('input-dept').value = row.dept || '';
            document.getElementById('input-type').value = row.type || '불안전 상태';
            document.getElementById('input-guide-date').value = row.guideDate || '';
            document.getElementById('input-plan-date').value = row.planDate || '';
            document.getElementById('input-complete-date').value = row.completeDate || '';

            clearImg('beforeCell'); clearImg('afterCell');
            if(row.beforeImg) {
                images.beforeCell = row.beforeImg;
                document.getElementById('beforeImg').src = row.beforeImg;
                document.getElementById('beforeImg').style.display = 'block';
                document.getElementById('beforeText').style.display = 'none';
            }
            if(row.afterImg) {
                images.afterImg = row.afterImg;
                document.getElementById('afterImg').src = row.afterImg;
                document.getElementById('afterImg').style.display = 'block';
                document.getElementById('afterText').style.display = 'none';
            }
            updateHeaderDate();
            refreshDataView();
        }

        function resetForm() {
            editingId = null;
            window.editingId = null;
            document.getElementById('form-mode-title').innerText = '점검 등록';
            document.getElementById('btn-cancel-edit').style.display = 'none';
            
            document.getElementById('input-item').value = '';
            document.getElementById('input-solution').value = '';
            document.getElementById('input-zone').value = '';
            document.getElementById('input-target').value = '생산팀';
            document.getElementById('input-dept').value = '';
            document.getElementById('input-type').value = '불안전 상태';
            
            const today = new Date().toISOString().substring(0, 10);
            document.getElementById('input-guide-date').value = today;
            document.getElementById('input-plan-date').value = '';
            document.getElementById('input-complete-date').value = '';

            clearImg('beforeCell'); clearImg('afterCell');
            updateCategoryUI();
        }

        function deleteRecord(e, id) {
            e.stopPropagation();
            if(window.deleteRecordFromFirestore) {
                window.deleteRecordFromFirestore(id);
            }
        }

        function getTargetExportData() {
            const filteredList = getFilteredAndSortedData();
            if (selectedIds.size > 0) {
                return filteredList.filter(item => selectedIds.has(item.id));
            }
            return filteredList;
        }

        function exportToExcel() {
            const exportList = getTargetExportData();
            if(exportList.length === 0) { alert('내보낼 데이터가 없습니다.'); return; }
            
            showToast(selectedIds.size > 0 ? `선택한 ${selectedIds.size}건 엑셀 추출 중...` : '전체 목록 엑셀 추출 중...');

            const excelData = exportList.map((item, idx) => ({
                '번호': idx + 1,
                '구분': hasAfterImage(item) ? '개선후' : '개선전',
                '점검분류': item.category,
                '공장식별': item.seqCode,
                '상태/행동': item.type,
                '대상팀': item.target,
                '점검구역': item.zone,
                '안건': item.item,
                '개선안': item.solution,
                '조치부서': item.dept,
                '지도일자': item.guideDate,
                '계획일자': item.planDate,
                '완료일자': item.completeDate
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "점검목록");
            XLSX.writeFile(workbook, `안전점검내역_${currentCategory}_${new Date().toISOString().substring(0,10)}.xlsx`);
        }

                    slide.addTable([

        async function handlePPTImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            showToast('PPT 파일 분석 중...');

            try {
                const zip = await JSZip.loadAsync(file);
                const slideFiles = Object.keys(zip.files).filter(fileName => fileName.startsWith('ppt/slides/slide') && fileName.endsWith('.xml'));

                if (slideFiles.length === 0) {
                    alert('유효한 PPT 슬라이드가 없습니다.');
                    return;
                }

                slideFiles.sort((a, b) => {
                    const numA = parseInt(a.match(/\d+/)[0]);
                    const numB = parseInt(b.match(/\d+/)[0]);
                    return numA - numB;
                });

                const importedRecords = [];

                for (let i = 0; i < slideFiles.length; i++) {
                    const slideFileName = slideFiles[i];
                    const slideXmlStr = await zip.file(slideFileName).async('string');
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(slideXmlStr, 'text/xml');

                    const shapes = xmlDoc.getElementsByTagName('p:sp');
                    const extractedTexts = [];

                    for (let s = 0; s < shapes.length; s++) {
                        const pNodes = shapes[s].getElementsByTagName('a:p');
                        let shapeLines = [];
                        for (let p = 0; p < pNodes.length; p++) {
                            const tNodes = pNodes[p].getElementsByTagName('a:t');
                            let lineText = '';
                            for (let t = 0; t < tNodes.length; t++) {
                                lineText += tNodes[t].textContent || '';
                            }
                            if (lineText.trim()) shapeLines.push(lineText.trim());
                        }
                        if (shapeLines.length > 0) extractedTexts.push(shapeLines.join(' '));
                    }

                    const cellNodes = xmlDoc.getElementsByTagName('a:tc');
                    for (let c = 0; c < cellNodes.length; c++) {
                        const tNodes = cellNodes[c].getElementsByTagName('a:t');
                        let cellText = '';
                        for (let t = 0; t < tNodes.length; t++) {
                            cellText += tNodes[t].textContent || '';
                        }
                        if (cellText.trim()) extractedTexts.push(cellText.trim());
                    }

                    const slideNum = slideFileName.match(/\d+/)[0];
                    const relsFileName = `ppt/slides/_rels/slide${slideNum}.xml.rels`;
                    let beforeImgs = [];
                    let afterImgs = [];

                    if (zip.file(relsFileName)) {
                        const relsXmlStr = await zip.file(relsFileName).async('string');
                        const relsDoc = parser.parseFromString(relsXmlStr, 'text/xml');
                        const relationships = relsDoc.getElementsByTagName('Relationship');
                        
                        const imgRelMap = {};
                        for (let r = 0; r < relationships.length; r++) {
                            const id = relationships[r].getAttribute('Id');
                            const target = relationships[r].getAttribute('Target');
                            if (target && target.includes('media/')) {
                                imgRelMap[id] = target.replace('../media/', 'ppt/media/');
                            }
                        }

                        const blips = xmlDoc.getElementsByTagName('a:blip');
                        for (let b = 0; b < blips.length; b++) {
                            const embedId = blips[b].getAttribute('r:embed');
                            if (embedId && imgRelMap[embedId]) {
                                const imgPath = imgRelMap[embedId];
                                const imgFile = zip.file(imgPath);
                                if (imgFile) {
                                    const imgData = await imgFile.async('base64');
                                    const ext = imgPath.split('.').pop().toLowerCase();
                                    const mime = (ext === 'png') ? 'image/png' : 'image/jpeg';
                                    const base64Str = `data:${mime};base64,${imgData}`;

                                    let xPos = 0;
                                    let ancestor = blips[b].parentNode;
                                    while (ancestor && ancestor.tagName !== 'p:pic' && ancestor.tagName !== 'p:graphicFrame') {
                                        ancestor = ancestor.parentNode;
                                    }
                                    if (ancestor) {
                                        const off = ancestor.getElementsByTagName('a:off')[0];
                                        if (off) xPos = parseInt(off.getAttribute('x') || '0');
                                    }

                                    if (xPos > 0 && xPos < 4500000) {
                                        beforeImgs.push(base64Str);
                                    } else if (xPos >= 4500000) {
                                        afterImgs.push(base64Str);
                                    } else {
                                        if (beforeImgs.length === 0) beforeImgs.push(base64Str);
                                        else afterImgs.push(base64Str);
                                    }
                                }
                            }
                        }
                    }

                    const getValueAfterLabel = (label) => {
                        const targetLabel = label.replace(/\s+/g, '');
                        for (let t = 0; t < extractedTexts.length; t++) {
                            const cleanText = extractedTexts[t].replace(/\s+/g, '');
                            if (cleanText === targetLabel && t + 1 < extractedTexts.length) {
                                return extractedTexts[t + 1];
                            } else if (cleanText.startsWith(targetLabel) && cleanText.length > targetLabel.length) {
                                return extractedTexts[t].replace(new RegExp(`^${label}\\s*`), '').trim();
                            }
                        }
                        return '';
                    };

                    const seqCode = (extractedTexts.find(t => t.includes('예산 공장')) || `예산 공장-${i+1}`);
                    const item = getValueAfterLabel('안건') || getValueAfterLabel('안 건');
                    const solution = getValueAfterLabel('개선안');
                    const zone = getValueAfterLabel('점검구역') || getValueAfterLabel('점검 구역');
                    const target = getValueAfterLabel('대상') || getValueAfterLabel('대 상') || '생산팀';
                    const dept = getValueAfterLabel('조치부서') || getValueAfterLabel('조치 부서');
                    const type = getValueAfterLabel('상태/행동') || '불안전 상태';

                    const extractDate = (label) => {
                        const val = getValueAfterLabel(label);
                        if (!val) return '';
                        const matchFull = val.match(/\d{4}-\d{2}-\d{2}/);
                        if (matchFull) return matchFull[0];
                        const matchShort = val.match(/(\d{1,2})[\.\-](\d{1,2})/);
                        if (matchShort) {
                            const currentYear = new Date().getFullYear();
                            const mm = matchShort[1].padStart(2, '0');
                            const dd = matchShort[2].padStart(2, '0');
                            return `${currentYear}-${mm}-${dd}`;
                        }
                        return '';
                    };

                    const guideDate = extractDate('지도일자') || extractDate('지도 일자') || new Date().toISOString().substring(0, 10);
                    const planDate = extractDate('계획일자') || extractDate('계획 일자') || '';
                    const completeDate = extractDate('완료일자') || extractDate('완료 일자') || '';

                    const beforeImg = beforeImgs[0] || '';
                    const afterImg = afterImgs[0] || '';

                    if (item) {
                        importedRecords.push({
                            category: currentCategory,
                            seqCode: seqCode,
                            item: item,
                            solution: solution,
                            zone: zone,
                            target: TARGET_TEAMS.includes(target) ? target : '생산팀',
                            dept: dept,
                            type: type.includes('행동') ? '불안전 행동' : '불안전 상태',
                            guideDate: guideDate,
                            planDate: planDate,
                            completeDate: completeDate,
                            beforeImg: beforeImg,
                            afterImg: afterImg,
                            regDate: guideDate || new Date().toISOString().substring(0, 10)
                        });
                    }
                }

                if (importedRecords.length === 0) {
                    alert('PPT에서 올바른 안전점검 양식을 찾지 못했습니다.');
                    return;
                }

                if (confirm(`총 ${importedRecords.length}건의 점검 항목을 불러왔습니다. 현재 카테고리 [${currentCategory}]로 DB에 저장하시겠습니까?`)) {
                    if (window.batchSaveToFirestore) {
                        await window.batchSaveToFirestore(importedRecords);
                    }
                }

            } catch (err) {
                console.error('PPT 분석 에러:', err);
                alert('PPT 파일을 읽는 중 오류가 발생했습니다.');
            } finally {
                e.target.value = '';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
